<script>(function (root) {
  const axes = {noise:30, property:25, space:20, access:15, upkeep:10};
  const labels = {noise:'安静度', property:'物业维护', space:'公共空间', access:'出入便利', upkeep:'楼栋与设备'};
  const positive = n => Number.isFinite(n) && n > 0;
  const day = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && Number.isFinite(Date.parse(s))
    && new Date(s).toISOString().slice(0,10) === s;
  const recent = (date, today, ttl) => day(date) && day(today)
    && Date.parse(today) - Date.parse(date) >= 0 && Date.parse(today) - Date.parse(date) <= ttl * 86400000;
  const point = p => p && ['WGS84','GCJ02'].includes(p.crs) && Number.isFinite(p.lon)
    && Math.abs(p.lon)<=180 && Number.isFinite(p.lat) && Math.abs(p.lat)<=90;
  const source = s => typeof s === 'string' && !!s.trim();
  function validate(d) {
    if (d?.version !== 1) throw Error('数据版本必须为 1');
    const keys = ['communities','listings','saleSamples','quality','routes','destinations'];
    for (const k of keys) if (!Array.isArray(d[k]) || d[k].some(r => !r || typeof r !== 'object')) throw Error(k+' 必须是记录数组');
    function ids(rows, label) {
      const seen = new Set();
      for (const r of rows) {
        if (!source(r.id) || seen.has(r.id)) throw Error(label+' ID 缺失或重复');
        seen.add(r.id);
      }
      return seen;
    }
    const communities = ids(d.communities,'小区');
    const destinations = ids(d.destinations,'目的地');
    for (const k of ['layouts','stationAccess']) {
      if (d[k] != null && (!Array.isArray(d[k]) || d[k].some(r => !r || !communities.has(r.communityId)))) {
        throw Error(k+' 存在无效记录或未知小区');
      }
    }
    ids(d.layouts||[],'户型');
    const layouts = new Map((d.layouts||[]).map(r=>[r.id,r]));
    for (const r of d.layouts||[]) {
      if (!source(r.name)) throw Error('户型名称缺失');
    }
    for (const r of d.stationAccess||[]) {
      if (!source(r.station)||!source(r.source)||(r.walkMinutes!=null&&!(Number.isFinite(r.walkMinutes)&&r.walkMinutes>=0))) {
        throw Error('站点步行记录须有车站、证据和有效分钟数');
      }
    }
    for (const r of d.listings) {
      if (r.layoutId!=null && layouts.get(r.layoutId)?.communityId!==r.communityId) throw Error('房源户型关联无效');
    }
    ids(d.listings,'房源'); ids(d.saleSamples,'出售样本');
    for (const k of ['listings','saleSamples','quality','routes']) {
      if (d[k].some(r => !communities.has(r.communityId))) throw Error(k+' 存在未知小区');
    }
    for (const r of [...d.communities,...d.destinations]) {
      if (!source(r.name) || (r.location != null && (!point(r.location) || !source(r.location.source)))) throw Error('名称或坐标证据有误');
    }
    for (const r of d.communities) {
      if (r.year != null && (!Number.isInteger(r.year) || r.year<1800 || r.year>2100)) throw Error('建成年份无效');
      if (r.tags != null && (!Array.isArray(r.tags) || r.tags.some(t=>typeof t!=='string'))) throw Error('标签必须是文本数组');
    }
    for (const r of [...d.listings,...d.saleSamples,...d.quality,...d.routes]) {
      if (!day(r.checkedAt) || !source(r.source)) throw Error('动态记录须填写证据来源与核验日期');
    }
    for (const r of [...d.listings,...d.saleSamples]) {
      if (['areaM2','monthlyRent','totalPrice'].some(k=>r[k]!=null&&!positive(r[k]))) throw Error('价格及面积须为正数或空值');
      if (r.bedrooms!=null && (!Number.isInteger(r.bedrooms)||r.bedrooms<0)) throw Error('卧室数无效');
    }
    for (const r of d.listings) if (!['active','inactive','unknown'].includes(r.status)) throw Error('房源状态无效');
    for (const r of d.quality) if (!Object.hasOwn(axes,r.axis) || ![0,1,2,3,4].includes(r.rating)) throw Error('品质维度或评分无效');
    for (const r of d.routes) {
      if (!destinations.has(r.destinationId) || !['transit','drive','walk','bike'].includes(r.mode)
        || !source(r.scenario) || (!positive(r.km) && !positive(r.minutes))) throw Error('路线记录无效');
    }
    return d;
  }
  function latest(rows, key) {
    const result = new Map();
    for (const r of rows) {
      const k = key(r);
      if (!result.has(k) || r.checkedAt >= result.get(k).checkedAt) result.set(k,r);
    }
    return [...result.values()];
  }
  const distinct = rows => latest(rows,r=>r.unitKey ? 'unit:'+r.unitKey : 'id:'+r.id);
  function current(rows,today) {
    return distinct(rows).filter(r=>r.status==='active' && r.tenure==='whole' && recent(r.checkedAt,today,7));
  }
  function matches(r,f) {
    return (f.rent==null || (positive(r.monthlyRent) && r.monthlyRent<=f.rent))
      && (f.area==null || (positive(r.areaM2) && r.areaM2>=f.area))
      && (f.bedrooms==null || r.bedrooms===f.bedrooms);
  }
  function median(values) {
    if (!values.length) return null;
    const a = [...values].sort((a,b)=>a-b);
    return (a[Math.floor((a.length-1)/2)] + a[Math.floor(a.length/2)])/2;
  }
  function yieldEstimate(rents,sales,today,bedrooms,areaMin,areaMax) {
    const comparable = r => r.bedrooms===bedrooms && r.areaBasis==='gross'
      && positive(r.areaM2) && r.areaM2>=areaMin && r.areaM2<=areaMax && source(r.unitKey);
    const r = current(rents,today).filter(x=>comparable(x)&&positive(x.monthlyRent));
    const s = distinct(sales).filter(x=>comparable(x)&&x.kind==='asking'
      && recent(x.checkedAt,today,30)&&positive(x.totalPrice));
    return {rentN:r.length,saleN:s.length,pct:r.length>=3 && s.length>=3
      ? 1200*median(r.map(x=>x.monthlyRent/x.areaM2))/median(s.map(x=>x.totalPrice/x.areaM2)) : null};
  }
  function quality(rows,today) {
    const evidence = latest(rows.filter(r=>recent(r.checkedAt,today,180)),r=>r.axis);
    const coverage = evidence.reduce((sum,r)=>sum+axes[r.axis],0);
    const score = coverage===100 ? evidence.reduce((sum,r)=>sum+axes[r.axis]*r.rating/4,0) : null;
    return {coverage,score,evidence};
  }
  function distance(a,b) {
    if (!point(a) || !point(b) || a.crs!==b.crs) return null;
    const rad = Math.PI/180;
    const h = Math.sin((b.lat-a.lat)*rad/2)**2
      + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin((b.lon-a.lon)*rad/2)**2;
    return 12742*Math.asin(Math.sqrt(Math.min(1,Math.max(0,h))));
  }
  const api = {labels,validate,point,recent,latest,current,matches,median,yieldEstimate,quality,distance};
  if (typeof module !== 'undefined') module.exports=api;
  else root.RentModel=api;
})(globalThis);
</script>
<script>(function (root) {
  const hub = '龙华中路';
  // Consecutive stations in the displayed excerpts. Shared names here are verified transfers.
  const lines = [
    {id:'7', color:'#df712b', stops:['东安路',hub,'后滩','长清路','耀华路','云台路','高科西路','杨高南路','锦绣路','芳华路','龙阳路','花木路']},
    {id:'12', color:'#328963', stops:['漕宝路','龙漕路','龙华',hub,'大木桥路','嘉善路','陕西南路']},
    {id:'8', color:'#2285be', stops:['中华艺术宫','耀华路','成山路','杨思','东方体育中心','凌兆新村','芦恒路']},
    {id:'13', color:'#bd6398', stops:['成山路','东明路','华鹏路']},
    {id:'11', color:'#9b5245', stops:['龙华','云锦路','龙耀路','东方体育中心','三林','三林东','浦三路','康恒路','御桥','罗山路','秀沿路']}
  ];
  const positions = {
    东安路:[280,85], 龙华中路:[280,160], 后滩:[365,160], 长清路:[450,160], 耀华路:[535,160],
    云台路:[620,160], 高科西路:[705,160], 杨高南路:[790,160], 锦绣路:[875,160], 芳华路:[960,160],
    龙阳路:[1045,160], 花木路:[1130,160], 漕宝路:[45,315], 龙漕路:[130,315], 龙华:[215,315],
    大木桥路:[390,95], 嘉善路:[490,55], 陕西南路:[600,55], 中华艺术宫:[535,87], 成山路:[535,224],
    杨思:[535,293], 东方体育中心:[535,380], 凌兆新村:[440,458], 芦恒路:[350,458], 云锦路:[310,380],
    龙耀路:[420,380], 三林:[620,380], 三林东:[705,380], 浦三路:[790,380], 康恒路:[875,380],
    御桥:[960,380], 罗山路:[1045,380], 秀沿路:[1130,380], 东明路:[640,224], 华鹏路:[745,224]
  };
  const key = (station,line) => station+'|'+line;
  const order = (a,b) => a.transfers-b.transfers || a.stops-b.stops;
  function routes() {
    const graph = new Map();
    const byStation = new Map();
    for (const line of lines) for (const [i,station] of line.stops.entries()) {
      const id=key(station,line.id);
      const state={id,station,line:line.id};
      graph.set(id,{state,edges:[line.stops[i-1],line.stops[i+1]].filter(Boolean)
        .map(next=>({id:key(next,line.id),transfer:false}))});
      if (!byStation.has(station)) byStation.set(station,[]);
      byStation.get(station).push(state);
    }
    for (const states of byStation.values()) for (const state of states) {
      for (const other of states) if (other.id!==state.id) graph.get(state.id).edges.push({id:other.id,transfer:true});
    }
    const best=new Map();
    const queue=byStation.get(hub).map(state=>({id:state.id,transfers:0,stops:0,path:[state]}));
    while(queue.length){
      queue.sort(order);
      const here=queue.shift();
      if(best.has(here.id)) continue;
      best.set(here.id,here);
      for(const edge of graph.get(here.id).edges) if(!best.has(edge.id)) {
        queue.push({id:edge.id,transfers:here.transfers+Number(edge.transfer),
          stops:here.stops+Number(!edge.transfer),path:[graph.get(edge.id).state,...here.path]});
      }
    }
    return new Map([...byStation].map(([name,states])=>[name,states.map(s=>best.get(s.id)).filter(Boolean).sort(order)[0]]));
  }
  const api={hub,lines,positions,routes};
  if(typeof module==='object') module.exports=api;
  else root.Metro=api;
})(globalThis);
</script>
<script>const initialData = {"version": 1, "communities": [{"id": "pd-xyxl-68", "name": "保利林语溪", "district": "浦东新区", "area": "康桥镇／三林周边", "address": "秀沿西路68弄", "year": 2011, "households": 1878, "location": null, "tags": ["保利开发", "约1878户", "历史积水整改｜现状待核"], "source": "https://www.pudong.gov.cn/pudong-interaction-front/collect/detail/a54ae3fa3dca4a83bdd00e37ecabb797", "note": "采用康桥镇材料的建成年份和约数。房天下建筑年代字段为2010。整改材料描述的是历史积水及计划，当前状态未知。作为对照样本，尚未确认是此前谈到的保利项目。"}, {"id": "pd-sbl-518", "name": "金地湾流域｜尚博路518弄", "district": "浦东新区", "area": "三林", "address": "尚博路518弄", "year": null, "households": null, "location": null, "tags": [], "source": "https://sh.loupan.com/community/8596965.html", "note": "候选门牌。来源同时列出569弄。分期边界、年份及户数待核。"}, {"id": "pd-ddzl-94", "name": "三林世博家园｜大道站路94弄", "district": "浦东新区", "area": "三林", "address": "大道站路94弄", "year": null, "households": null, "location": null, "tags": ["基线对照"], "source": "https://m.fang.com/xiaoqu/strategy/sh/1210166704.html", "note": "来源列出2005竣工、2006建筑年代，门牌和统计范围仍需复核。避免把整个世博家园户数归到这个门牌。"}], "stationAccess": [], "layouts": [], "listings": [], "saleSamples": [], "quality": [], "routes": [], "destinations": []};</script>
<script>'use strict';
const M = RentModel;
const $ = id => document.getElementById(id);
const value = id => $(id).value === '' ? null : $(id).valueAsNumber;
const today = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());
const fmt = (v,suffix='',digits=0) => Number.isFinite(v) ? v.toLocaleString('zh-CN',{maximumFractionDigits:digits})+suffix : '待核验';
function node(tag,text,parent) {
  const e = document.createElement(tag);
  if (text != null) e.textContent=text;
  if (parent) parent.append(e);
  return e;
}
function link(parent,label,url) {
  try {
    const u = new URL(url);
    if (!['https:','http:'].includes(u.protocol)) return;
    const a=node('a',label,parent);
    a.href=u.href; a.target='_blank'; a.rel='noopener noreferrer';
  } catch {}
}
function options(id,rows,placeholder) {
  const select=$(id), previous=select.value;
  select.replaceChildren(new Option(placeholder,''));
  for (const r of rows) select.add(new Option(r.name,r.id));
  if (rows.some(r=>r.id===previous)) select.value=previous;
}
let data=M.validate(initialData);
function refresh() {
  options('destination',data.destinations,'选择目的地');
  if (data.destinations.length===1) $('destination').value=data.destinations[0].id;
  render();
}
function renderMap(rows,destination) {
  const box=$('map'), crs=$('crs').value;
  box.replaceChildren();
  const sites=rows.filter(r=>M.point(r.c.location)&&r.c.location.crs===crs)
    .map(r=>({p:r.c.location,name:r.c.name,id:r.c.id}));
  $('mapnote').textContent=rows.length-sites.length+' 个结果未在当前坐标系落点。';
  if (!sites.length) {
    node('p','当前无已核验坐标。可从小区卡片打开地址检索，或导入带坐标来源的数据。',box);
    return;
  }
  if (destination?.location?.crs===crs) sites.push({p:destination.location,name:destination.name});
  const svgNode=(tag,attrs,parent)=>{
    const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
    for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
    parent.append(e);
    return e;
  };
  const svg=svgNode('svg',{viewBox:'0 0 640 420','aria-label':'小区坐标分布'},box);
  const avgLat=sites.reduce((s,r)=>s+r.p.lat,0)/sites.length;
  const xs=sites.map(r=>r.p.lon*Math.cos(avgLat*Math.PI/180)), ys=sites.map(r=>r.p.lat);
  const mid=a=>(Math.min(...a)+Math.max(...a))/2;
  const span=a=>Math.max(...a)-Math.min(...a);
  const scale=Math.min(510/Math.max(span(xs),.002),315/Math.max(span(ys),.002));
  for(let x=40;x<640;x+=40) svgNode('path',{d:'M'+x+' 0V420',stroke:'#dce9df'},svg);
  for(let y=20;y<420;y+=40) svgNode('path',{d:'M0 '+y+'H640',stroke:'#dce9df'},svg);
  svgNode('text',{x:18,y:28,fill:'#31564b'},svg).textContent='↑ 北';
  sites.forEach((r,i)=>{
    const x=320+(xs[i]-mid(xs))*scale,y=210-(ys[i]-mid(ys))*scale;
    const g=svgNode('g',r.id?{tabindex:0,role:'button','aria-label':r.name}:{},svg);
    svgNode('title',{},g).textContent=r.name;
    svgNode('circle',{cx:x,cy:y,r:8,fill:r.id?'#236d58':'#af5825',stroke:'white','stroke-width':2},g);
    svgNode('text',{x:x+11,y:y-9,'font-size':12,fill:'#1d4036'},g).textContent=r.id ? i+1 : '目的地';
    if(r.id){
      const open=()=>{const card=$('card-'+r.id);card.focus();card.scrollIntoView({block:'nearest'});};
      g.addEventListener('click',open);
      g.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();open();}});
    }
  });
  node('p',sites.map((s,i)=>s.id ? (i+1)+' '+s.name : '目的地 '+s.name).join(' · '),box);
}
function render() {
  const date=today(), destination=data.destinations.find(x=>x.id===$('destination').value);
  const validRoutes=data.routes.filter(r=>r.destinationId===destination?.id && r.mode===$('mode').value && M.recent(r.checkedAt,date,30));
  const scenarios=[...new Set(validRoutes.map(r=>r.scenario))].sort();
  options('scenario',scenarios.map(s=>({id:s,name:s})),'选择同一出行场景');
  if (scenarios.length===1) $('scenario').value=scenarios[0];
  const filter={rent:value('rent'),area:value('area'),bedrooms:value('beds')};
  const hasFilter=Object.values(filter).some(x=>x!=null);
  const year=value('year'), yb=value('yb'), ya=value('ya'), yz=value('yz');
  const comparable=Number.isInteger(yb)&&yb>=0&&ya>0&&yz>=ya;
  let rows=data.communities.map(c=>{
    const rents=data.listings.filter(r=>r.communityId===c.id);
    const active=M.current(rents,date);
    const shown=active.filter(r=>M.matches(r,filter));
    const sales=data.saleSamples.filter(r=>r.communityId===c.id);
    return {c,active,shown,
      y:comparable ? M.yieldEstimate(rents,sales,date,yb,ya,yz) : null,
      q:M.quality(data.quality.filter(r=>r.communityId===c.id),date),
      direct:M.distance(c.location,destination?.location),
      route:M.latest(validRoutes.filter(r=>r.communityId===c.id&&r.scenario===$('scenario').value),r=>r.communityId)[0]};
  }).filter(r=>(year==null||(r.c.year!=null&&r.c.year>=year))&&(!hasFilter||r.shown.length));
  const sorters={direct:r=>r.direct,route:r=>r.route?.km,minutes:r=>r.route?.minutes,quality:r=>r.q.score==null?null:-r.q.score};
  const sort=sorters[$('sort').value];
  if(sort) rows.sort((a,b)=>(sort(a)??Infinity)-(sort(b)??Infinity));
  $('summary').textContent=rows.length+' / '+data.communities.length+' 个小区 · 当前筛选命中 '+rows.reduce((n,r)=>n+r.shown.length,0)+' 条近期在租观察。0 表示本库无匹配记录。';
  $('cards').replaceChildren();
  if(!rows.length) node('article','没有符合条件的已核验记录。清空筛选可重新查看候选小区。',$('cards'));
  for(const {c,shown,y,q,direct,route} of rows){
    const card=node('article',null,$('cards'));
    card.id='card-'+c.id;card.tabIndex=-1;
    node('h2',c.name,card);
    node('p',[c.area,c.address].filter(Boolean).join(' · '),card);
    node('p',fmt(c.year,' 年建成')+' · '+fmt(c.households,' 户'),card);
    for(const t of c.tags||[]) node('span',t,card).className='tag';
    if(c.note) node('p',c.note,card).className='muted';
    const refs=node('p',null,card);
    link(refs,'小区资料',c.source);
    if(c.location) {refs.append(' · ');link(refs,'坐标来源',c.location.source);}
    refs.append(' · ');
    link(refs,'高德搜索地址','https://uri.amap.com/search?city=上海&keyword='+encodeURIComponent([c.address,c.name.split('｜')[0]].filter(Boolean).join(' ')));
    node('p','品质 '+fmt(q.score,' / 100',1)+' · 证据覆盖 '+q.coverage+'%',card);
    for(const e of q.evidence){
      const p=node('p',M.labels[e.axis]+' '+e.rating+'/4 · '+e.checkedAt+' · '+e.source,card);
      link(p,' 查看证据',e.source);
    }
    node('p','在租 '+shown.length+' 条观察 · '+fmt(M.median(shown.map(r=>r.monthlyRent).filter(Number.isFinite)),' 元/月中位数'),card);
    for(const r of shown){
      const p=node('p',[fmt(r.monthlyRent,' 元/月'),fmt(r.areaM2,' ㎡',1),fmt(r.bedrooms,' 室'),r.checkedAt,r.source].join(' · '),card);
      link(p,' 查看房源来源',r.source);
    }
    node('p','毛挂牌租售比 '+fmt(y?.pct,'%',2)+(y?' · 租 '+y.rentN+' / 售 '+y.saleN+' 套':' · 对照组条件无效'),card);
    node('p','直线 '+fmt(direct,' km',2)+' · 路线 '+fmt(route?.km,' km',2)+' · '+fmt(route?.minutes,' 分钟',1),card);
    if(route) {
      const p=node('p','路线场景 '+route.scenario+' · '+route.checkedAt+' · '+route.source,card);
      link(p,' 查看路线证据',route.source);
    }
  }
  renderMap(rows,destination);
}
$('file').addEventListener('change',async e=>{
  if(!e.target.files.length) return;
  try{
    const file=e.target.files[0];
    if(file.size>5*1024*1024) throw Error('本地试点文件上限为 5 MiB');
    data=M.validate(JSON.parse(await file.text()));
    document.dispatchEvent(new Event('rent-data-loaded'));
    $('error').textContent='';
    refresh();
  }catch(error){$('error').textContent='载入失败 · '+error.message;}
  finally{e.target.value='';}
});
for(const id of ['rent','area','year','beds','destination','mode','scenario','sort','crs','yb','ya','yz']) $(id).addEventListener('input',render);
refresh();
</script>
<script>'use strict';
const metroRoutes=Metro.routes();
const svgNS='http://www.w3.org/2000/svg';
let selectedStation='三林';
function svgItem(tag,attrs,parent) {
  const el=document.createElementNS(svgNS,tag);
  for(const [name,value] of Object.entries(attrs)) el.setAttribute(name,value);
  parent.append(el);
  return el;
}
function selectStation(name,focusMap=false) {
  selectedStation=name;
  renderMetro();
  if(focusMap) document.querySelector('[data-station][aria-pressed="true"]')?.focus();
}
function renderMetro() {
  const max=$('transfer-limit').value;
  const available=[...metroRoutes].filter(([,r])=>r && (max==='all'||r.transfers<=Number(max)));
  available.sort((a,b)=>a[1].transfers-b[1].transfers||a[1].stops-b[1].stops);
  if(!available.some(([s])=>s===selectedStation)) selectedStation=Metro.hub;
  options('station-picker',available.map(([name,r])=>({id:name,name:name+(r.transfers?' · 换乘 '+r.transfers:' · 直达')})),'选择车站');
  $('station-picker').value=selectedStation;
  const route=metroRoutes.get(selectedStation);
  const map=$('metro-map');
  map.replaceChildren();
  const svg=svgItem('svg',{viewBox:'0 0 1180 500','aria-label':'龙华中路地铁通勤图'},map);
  const points=stops=>stops.map(s=>Metro.positions[s].join(',')).join(' ');
  for(const line of Metro.lines) {
    svgItem('polyline',{points:points(line.stops),fill:'none',stroke:line.color,'stroke-width':6,
      opacity:.4,'stroke-linecap':'round','stroke-linejoin':'round'},svg);
  }
  for(let i=1;i<route.path.length;i++){
    const a=route.path[i-1],b=route.path[i];
    if(a.station===b.station) continue;
    const color=Metro.lines.find(line=>line.id===a.line).color;
    svgItem('polyline',{points:points([a.station,b.station]),fill:'none',stroke:color,'stroke-width':7,'stroke-linecap':'round'},svg);
  }
  for(const [station,r] of available) {
    const [x,y]=Metro.positions[station];
    const hub=station===Metro.hub, selected=station===selectedStation;
    const color=['#087d61','#579887','#879e95'][Math.min(2,r.transfers)];
    const opacity=[1,.76,.53][Math.min(2,r.transfers)];
    const g=svgItem('g',{tabindex:0,role:'button','data-station':station,'aria-pressed':selected,
      'aria-label':station+(hub?'，通勤终点':'，换乘 '+r.transfers+' 次')},svg);
    svgItem('circle',{cx:x,cy:y,r:22,fill:'transparent'},g);
    svgItem('circle',{cx:x,cy:y,r:hub?12:selected?10:7,fill:hub?'#203e33':color,
      opacity:hub||selected?1:opacity,stroke:selected?'#203e33':'white','stroke-width':2},g);
    svgItem('text',{x,y:y+(station==='龙华中路'?31:25),'text-anchor':'middle',
      fill:'#233b32','font-size':hub?16:13,'font-weight':hub||selected?700:400},g).textContent=station;
    g.addEventListener('click',()=>selectStation(station,true));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectStation(station,true);}});
  }
  renderStation(route);
}
function renderStation(route) {
  const panel=$('station-panel');
  panel.replaceChildren();
  node('h2',selectedStation,panel);
  const legs=[route.path[0].line+' 号线'];
  for(let i=1;i<route.path.length;i++) if(route.path[i-1].line!==route.path[i].line) {
    legs.push('在'+route.path[i].station+'换 '+route.path[i].line+' 号线');
  }
  node('p',selectedStation===Metro.hub?'通勤终点':(route.transfers?route.transfers+' 次换乘':'直达')+' · '+route.stops+' 站',panel);
  if(route.stops) node('p',legs.join(' → ')+' → 龙华中路',panel).className='muted';
  const access=new Map((data.stationAccess||[]).filter(a=>a.station===selectedStation).map(a=>[a.communityId,a]));
  const provider=$('provider').value, walk=value('walk-limit'), year=value('year');
  const filter={rent:value('rent'),area:value('area'),bedrooms:value('beds')};
  const groups=[];
  for(const c of data.communities){
    const a=access.get(c.id);
    if(!a || (walk!=null && !(Number.isFinite(a.walkMinutes)&&a.walkMinutes<=walk))
      || (year!=null && !(c.year>=year))) continue;
    const observations=data.listings.filter(r=>r.communityId===c.id);
    const fresh=observations.filter(r=>r.status==='active'&&r.tenure==='whole'&&M.recent(r.checkedAt,today(),7));
    const unitKey=r=>r.unitKey?'unit:'+r.unitKey:'id:'+r.id;
    const activeKeys=new Set(M.current(observations,today()).map(unitKey));
    for(const r of fresh.filter(r=>activeKeys.has(unitKey(r))&&(!provider||r.provider===provider)&&M.matches(r,filter))){
      const layout=(data.layouts||[]).find(l=>l.id===r.layoutId&&l.communityId===c.id);
      const key=layout?'layout:'+layout.id:unitKey(r);
      let group=groups.find(g=>g.key===key&&g.community.id===c.id);
      if(!group){group={key,community:c,access:a,layout,rows:[]};groups.push(group);}
      group.rows.push(r);
    }
  }
  if(!groups.length){
    node('p',access.size?'当前没有符合筛选条件的近期整租挂牌。':'本站还没有已录入的站点与小区关联。',panel);
    node('p','可导入本地 JSON，或去平台查找并核验。',panel).className='muted';
  }
  const links=node('p',null,panel);
  for(const [name,url] of [['贝壳','https://sh.ke.com/zufang/'],['我爱我家','https://sh.5i5j.com/zufang/'],['自如','https://sh.ziroom.com/z/']]){
    if(links.childNodes.length) links.append(' · ');
    link(links,name,url);
  }
  for(const {community:c,access:a,layout,rows} of groups){
    const card=node('article',null,panel);
    node('h3',layout?.name||'格局待核 · '+fmt(rows[0].bedrooms,' 室'),card);
    const walkInfo=node('p',c.name+' · '+fmt(a.walkMinutes,' 分钟步行'),card);
    link(walkInfo,' · 到站证据',a.source);
    for(const tag of c.tags||[]) node('span',tag,card).className='tag';
    if(layout?.floorplanImage && /^https:\/\//i.test(layout.floorplanImage)){
      const img=node('img',null,card);
      img.addEventListener('error',()=>{img.replaceWith(node('p','户型图暂时无法加载'));});
      img.loading='lazy';img.referrerPolicy='no-referrer';img.alt=layout.name+'户型图';img.src=layout.floorplanImage;
    } else node('p','户型图待补',card).className='muted';
    if(layout?.floorplanUrl) link(card,'查看户型图来源',layout.floorplanUrl);
    const details=node('details',null,card);
    details.open=true;
    node('summary','查看 '+rows.length+' 条近期挂牌观察',details);
    for(const r of rows.sort((a,b)=>(a.monthlyRent??Infinity)-(b.monthlyRent??Infinity))){
      const p=node('p',null,details);
      node('strong',fmt(r.monthlyRent,' 元/月'),p);
      p.append(' · '+[fmt(r.areaM2,' ㎡',1),r.floor||'楼层待核',r.decoration||'装修待核'].join(' · '));
      node('small',[r.provider||'来源未分类',r.checkedAt,r.fees||'费用口径待核'].join(' · '),details);
      details.append(' ');
      link(details,'原挂牌',r.url||r.source);
    }
  }
}
$('station-picker').addEventListener('change',e=>{if(e.target.value)selectStation(e.target.value);});
for(const id of ['transfer-limit','provider','rent','area','beds','year','walk-limit']) $(id).addEventListener('input',renderMetro);
document.addEventListener('rent-data-loaded',renderMetro);
renderMetro();
</script>
