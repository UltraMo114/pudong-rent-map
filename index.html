<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浦东租住地图 · 三林试点</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#182e2c;background:#f3f5f0}
body{max-width:1230px;margin:auto;padding:24px} h1{font-size:clamp(27px,5vw,46px);margin:0}
h2{font-size:20px;margin:0 0 8px} p{margin:.35em 0}.kicker{font-size:12px;letter-spacing:.18em;color:#35665b}
section,article{border:1px solid #dce5d9;border-radius:15px;background:white;padding:17px;margin-top:15px}
.controls{display:flex;gap:12px;flex-wrap:wrap}label{display:grid;gap:4px;font-size:13px}
input,select,button{font:inherit;padding:5px 8px;border:1px solid #b7c9bf;border-radius:7px;background:white;color:inherit}
input[type=number]{width:105px}button{cursor:pointer} .columns{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}
small,.muted{color:#4e665e} .tag{display:inline-block;background:#e8f3ec;border-radius:12px;padding:1px 9px;margin:3px 5px 2px 0}
a{color:#1d6254}svg{width:100%;height:auto;background:#edf5ef;border-radius:10px}svg g[tabindex]{cursor:pointer}
article:target,article:focus{outline:2px solid #367760} ul{padding-left:20px} #error{color:#963b29}
@media(max-width:780px){body{padding:13px}.columns{grid-template-columns:1fr}}
</style>
<header>
<p class="kicker">PUDONG HOUSING LAB / 01</p>
<h1>浦东租住地图</h1>
<p>三林与周边 · 从小区候选到可核验的在租样本</p>
</header>
<section>
<div class="controls">
<label>载入本地 JSON<input type="file" id="file" accept=".json,application/json"></label>
<label>月租上限 · 元<input type="number" min="0" id="rent"></label>
<label>面积下限 · ㎡<input type="number" min="0" id="area"></label>
<label>建成年份起点<input type="number" min="1800" max="2100" id="year"></label>
<label>卧室数<input type="number" min="0" step="1" id="beds"></label>
<label>通勤目的地<select id="destination"></select></label>
<label>出行方式<select id="mode"><option value="transit">公交地铁</option><option value="drive">驾车</option><option value="walk">步行</option><option value="bike">骑行</option></select></label>
<label>路线场景<select id="scenario"></select></label>
<label>排序<select id="sort"><option value="default">资料顺序</option><option value="direct">直线距离</option><option value="route">路线距离</option><option value="minutes">路线耗时</option><option value="quality">品质分</option></select></label>
</div>
<p id="error" role="alert"></p><p id="summary" aria-live="polite"></p>
</section>
<div class="columns">
<div><section><h2>地理分布</h2><p class="muted">离线坐标图 · 北向上 · 同一坐标系 · 点击定位卡片</p>
<label>坐标系<select id="crs"><option>WGS84</option><option>GCJ02</option></select></label>
<div id="map"></div><p id="mapnote"></p></section>
<section><h2>租售比对照组</h2><div class="controls">
<label>卧室数<input type="number" id="yb" min="0" step="1" value="2"></label>
<label>面积下限 · ㎡<input type="number" id="ya" min="1" value="80"></label>
<label>面积上限 · ㎡<input type="number" id="yz" min="1" value="100"></label>
</div><small>仅整租挂牌与出售挂牌。两侧各至少 3 套已人工去重的同类样本。筛选区的房源条件独立于该口径。</small></section></div>
<div id="cards"></div>
</div>
<script>(function (root) {
  const axes = {noise:30, property:25, space:20, access:15, upkeep:10};
  const labels = {noise:'安静度', property:'物业维护', space:'公共空间', access:'出入便利', upkeep:'楼栋与设备'};
  const positive = n => Number.isFinite(n) && n > 0;
  const day = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && Number.isFinite(Date.parse(s))
    && new Date(s).toISOString().slice(0,10) === s;
  const recent = (date, today, ttl) => day(date) && day(today)
    && Date.parse(today) - Date.parse(date) >= 0 && Date.parse(today) - Date.parse(date) <= ttl * 86400000;
  const point = p => p && ['WGS84','GCJ02'].includes(p.crs) && Number.isFinite(p.lon)
    && Math.abs(p.lon)<=180 && Number.isFinite(p.lat) && Math.abs(p.lat)<=90;
  const source = s => typeof s === 'string' && !!s.trim();
  function validate(d) {
    if (d?.version !== 1) throw Error('数据版本必须为 1');
    const keys = ['communities','listings','saleSamples','quality','routes','destinations'];
    for (const k of keys) if (!Array.isArray(d[k]) || d[k].some(r => !r || typeof r !== 'object')) throw Error(k+' 必须是记录数组');
    function ids(rows, label) {
      const seen = new Set();
      for (const r of rows) {
        if (!source(r.id) || seen.has(r.id)) throw Error(label+' ID 缺失或重复');
        seen.add(r.id);
      }
      return seen;
    }
    const communities = ids(d.communities,'小区');
    const destinations = ids(d.destinations,'目的地');
    ids(d.listings,'房源'); ids(d.saleSamples,'出售样本');
    for (const k of ['listings','saleSamples','quality','routes']) {
      if (d[k].some(r => !communities.has(r.communityId))) throw Error(k+' 存在未知小区');
    }
    for (const r of [...d.communities,...d.destinations]) {
      if (!source(r.name) || (r.location != null && (!point(r.location) || !source(r.location.source)))) throw Error('名称或坐标证据有误');
    }
    for (const r of d.communities) {
      if (r.year != null && (!Number.isInteger(r.year) || r.year<1800 || r.year>2100)) throw Error('建成年份无效');
      if (r.tags != null && (!Array.isArray(r.tags) || r.tags.some(t=>typeof t!=='string'))) throw Error('标签必须是文本数组');
    }
    for (const r of [...d.listings,...d.saleSamples,...d.quality,...d.routes]) {
      if (!day(r.checkedAt) || !source(r.source)) throw Error('动态记录须填写证据来源与核验日期');
    }
    for (const r of [...d.listings,...d.saleSamples]) {
      if (['areaM2','monthlyRent','totalPrice'].some(k=>r[k]!=null&&!positive(r[k]))) throw Error('价格及面积须为正数或空值');
      if (r.bedrooms!=null && (!Number.isInteger(r.bedrooms)||r.bedrooms<0)) throw Error('卧室数无效');
    }
    for (const r of d.listings) if (!['active','inactive','unknown'].includes(r.status)) throw Error('房源状态无效');
    for (const r of d.quality) if (!Object.hasOwn(axes,r.axis) || ![0,1,2,3,4].includes(r.rating)) throw Error('品质维度或评分无效');
    for (const r of d.routes) {
      if (!destinations.has(r.destinationId) || !['transit','drive','walk','bike'].includes(r.mode)
        || !source(r.scenario) || (!positive(r.km) && !positive(r.minutes))) throw Error('路线记录无效');
    }
    return d;
  }
  function latest(rows, key) {
    const result = new Map();
    for (const r of rows) {
      const k = key(r);
      if (!result.has(k) || r.checkedAt >= result.get(k).checkedAt) result.set(k,r);
    }
    return [...result.values()];
  }
  const distinct = rows => latest(rows,r=>r.unitKey ? 'unit:'+r.unitKey : 'id:'+r.id);
  function current(rows,today) {
    return distinct(rows).filter(r=>r.status==='active' && r.tenure==='whole' && recent(r.checkedAt,today,7));
  }
  function matches(r,f) {
    return (f.rent==null || (positive(r.monthlyRent) && r.monthlyRent<=f.rent))
      && (f.area==null || (positive(r.areaM2) && r.areaM2>=f.area))
      && (f.bedrooms==null || r.bedrooms===f.bedrooms);
  }
  function median(values) {
    if (!values.length) return null;
    const a = [...values].sort((a,b)=>a-b);
    return (a[Math.floor((a.length-1)/2)] + a[Math.floor(a.length/2)])/2;
  }
  function yieldEstimate(rents,sales,today,bedrooms,areaMin,areaMax) {
    const comparable = r => r.bedrooms===bedrooms && r.areaBasis==='gross'
      && positive(r.areaM2) && r.areaM2>=areaMin && r.areaM2<=areaMax && source(r.unitKey);
    const r = current(rents,today).filter(x=>comparable(x)&&positive(x.monthlyRent));
    const s = distinct(sales).filter(x=>comparable(x)&&x.kind==='asking'
      && recent(x.checkedAt,today,30)&&positive(x.totalPrice));
    return {rentN:r.length,saleN:s.length,pct:r.length>=3 && s.length>=3
      ? 1200*median(r.map(x=>x.monthlyRent/x.areaM2))/median(s.map(x=>x.totalPrice/x.areaM2)) : null};
  }
  function quality(rows,today) {
    const evidence = latest(rows.filter(r=>recent(r.checkedAt,today,180)),r=>r.axis);
    const coverage = evidence.reduce((sum,r)=>sum+axes[r.axis],0);
    const score = coverage===100 ? evidence.reduce((sum,r)=>sum+axes[r.axis]*r.rating/4,0) : null;
    return {coverage,score,evidence};
  }
  function distance(a,b) {
    if (!point(a) || !point(b) || a.crs!==b.crs) return null;
    const rad = Math.PI/180;
    const h = Math.sin((b.lat-a.lat)*rad/2)**2
      + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin((b.lon-a.lon)*rad/2)**2;
    return 12742*Math.asin(Math.sqrt(Math.min(1,Math.max(0,h))));
  }
  const api = {labels,validate,point,recent,latest,current,matches,median,yieldEstimate,quality,distance};
  if (typeof module !== 'undefined') module.exports=api;
  else root.RentModel=api;
})(globalThis);
</script>
<script>const initialData = {"version": 1, "communities": [{"id": "pd-xyxl-68", "name": "保利林语溪", "district": "浦东新区", "area": "康桥镇／三林周边", "address": "秀沿西路68弄", "year": 2011, "households": 1878, "location": null, "tags": ["保利开发", "约1878户", "历史积水整改｜现状待核"], "source": "https://www.pudong.gov.cn/pudong-interaction-front/collect/detail/a54ae3fa3dca4a83bdd00e37ecabb797", "note": "采用康桥镇材料的建成年份和约数。房天下建筑年代字段为2010。整改材料描述的是历史积水及计划，当前状态未知。作为对照样本，尚未确认是此前谈到的保利项目。"}, {"id": "pd-sbl-518", "name": "金地湾流域｜尚博路518弄", "district": "浦东新区", "area": "三林", "address": "尚博路518弄", "year": null, "households": null, "location": null, "tags": [], "source": "https://sh.loupan.com/community/8596965.html", "note": "候选门牌。来源同时列出569弄。分期边界、年份及户数待核。"}, {"id": "pd-ddzl-94", "name": "三林世博家园｜大道站路94弄", "district": "浦东新区", "area": "三林", "address": "大道站路94弄", "year": null, "households": null, "location": null, "tags": ["基线对照"], "source": "https://m.fang.com/xiaoqu/strategy/sh/1210166704.html", "note": "来源列出2005竣工、2006建筑年代，门牌和统计范围仍需复核。避免把整个世博家园户数归到这个门牌。"}], "listings": [], "saleSamples": [], "quality": [], "routes": [], "destinations": []};</script>
<script>'use strict';
const M = RentModel;
const $ = id => document.getElementById(id);
const value = id => $(id).value === '' ? null : $(id).valueAsNumber;
const today = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date());
const fmt = (v,suffix='',digits=0) => Number.isFinite(v) ? v.toLocaleString('zh-CN',{maximumFractionDigits:digits})+suffix : '待核验';
function node(tag,text,parent) {
  const e = document.createElement(tag);
  if (text != null) e.textContent=text;
  if (parent) parent.append(e);
  return e;
}
function link(parent,label,url) {
  try {
    const u = new URL(url);
    if (!['https:','http:'].includes(u.protocol)) return;
    const a=node('a',label,parent);
    a.href=u.href; a.target='_blank'; a.rel='noopener noreferrer';
  } catch {}
}
function options(id,rows,placeholder) {
  const select=$(id), previous=select.value;
  select.replaceChildren(new Option(placeholder,''));
  for (const r of rows) select.add(new Option(r.name,r.id));
  if (rows.some(r=>r.id===previous)) select.value=previous;
}
let data=M.validate(initialData);
function refresh() {
  options('destination',data.destinations,'选择目的地');
  if (data.destinations.length===1) $('destination').value=data.destinations[0].id;
  render();
}
function renderMap(rows,destination) {
  const box=$('map'), crs=$('crs').value;
  box.replaceChildren();
  const sites=rows.filter(r=>M.point(r.c.location)&&r.c.location.crs===crs)
    .map(r=>({p:r.c.location,name:r.c.name,id:r.c.id}));
  $('mapnote').textContent=rows.length-sites.length+' 个结果未在当前坐标系落点。';
  if (!sites.length) {
    node('p','当前无已核验坐标。可从小区卡片打开地址检索，或导入带坐标来源的数据。',box);
    return;
  }
  if (destination?.location?.crs===crs) sites.push({p:destination.location,name:destination.name});
  const svgNode=(tag,attrs,parent)=>{
    const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
    for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
    parent.append(e);
    return e;
  };
  const svg=svgNode('svg',{viewBox:'0 0 640 420','aria-label':'小区坐标分布'},box);
  const avgLat=sites.reduce((s,r)=>s+r.p.lat,0)/sites.length;
  const xs=sites.map(r=>r.p.lon*Math.cos(avgLat*Math.PI/180)), ys=sites.map(r=>r.p.lat);
  const mid=a=>(Math.min(...a)+Math.max(...a))/2;
  const span=a=>Math.max(...a)-Math.min(...a);
  const scale=Math.min(510/Math.max(span(xs),.002),315/Math.max(span(ys),.002));
  for(let x=40;x<640;x+=40) svgNode('path',{d:'M'+x+' 0V420',stroke:'#dce9df'},svg);
  for(let y=20;y<420;y+=40) svgNode('path',{d:'M0 '+y+'H640',stroke:'#dce9df'},svg);
  svgNode('text',{x:18,y:28,fill:'#31564b'},svg).textContent='↑ 北';
  sites.forEach((r,i)=>{
    const x=320+(xs[i]-mid(xs))*scale,y=210-(ys[i]-mid(ys))*scale;
    const g=svgNode('g',r.id?{tabindex:0,role:'button','aria-label':r.name}:{},svg);
    svgNode('title',{},g).textContent=r.name;
    svgNode('circle',{cx:x,cy:y,r:8,fill:r.id?'#236d58':'#af5825',stroke:'white','stroke-width':2},g);
    svgNode('text',{x:x+11,y:y-9,'font-size':12,fill:'#1d4036'},g).textContent=r.id ? i+1 : '目的地';
    if(r.id){
      const open=()=>{const card=$('card-'+r.id);card.focus();card.scrollIntoView({block:'nearest'});};
      g.addEventListener('click',open);
      g.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();open();}});
    }
  });
  node('p',sites.map((s,i)=>s.id ? (i+1)+' '+s.name : '目的地 '+s.name).join(' · '),box);
}
function render() {
  const date=today(), destination=data.destinations.find(x=>x.id===$('destination').value);
  const validRoutes=data.routes.filter(r=>r.destinationId===destination?.id && r.mode===$('mode').value && M.recent(r.checkedAt,date,30));
  const scenarios=[...new Set(validRoutes.map(r=>r.scenario))].sort();
  options('scenario',scenarios.map(s=>({id:s,name:s})),'选择同一出行场景');
  if (scenarios.length===1) $('scenario').value=scenarios[0];
  const filter={rent:value('rent'),area:value('area'),bedrooms:value('beds')};
  const hasFilter=Object.values(filter).some(x=>x!=null);
  const year=value('year'), yb=value('yb'), ya=value('ya'), yz=value('yz');
  const comparable=Number.isInteger(yb)&&yb>=0&&ya>0&&yz>=ya;
  let rows=data.communities.map(c=>{
    const rents=data.listings.filter(r=>r.communityId===c.id);
    const active=M.current(rents,date);
    const shown=active.filter(r=>M.matches(r,filter));
    const sales=data.saleSamples.filter(r=>r.communityId===c.id);
    return {c,active,shown,
      y:comparable ? M.yieldEstimate(rents,sales,date,yb,ya,yz) : null,
      q:M.quality(data.quality.filter(r=>r.communityId===c.id),date),
      direct:M.distance(c.location,destination?.location),
      route:M.latest(validRoutes.filter(r=>r.communityId===c.id&&r.scenario===$('scenario').value),r=>r.communityId)[0]};
  }).filter(r=>(year==null||(r.c.year!=null&&r.c.year>=year))&&(!hasFilter||r.shown.length));
  const sorters={direct:r=>r.direct,route:r=>r.route?.km,minutes:r=>r.route?.minutes,quality:r=>r.q.score==null?null:-r.q.score};
  const sort=sorters[$('sort').value];
  if(sort) rows.sort((a,b)=>(sort(a)??Infinity)-(sort(b)??Infinity));
  $('summary').textContent=rows.length+' / '+data.communities.length+' 个小区 · 当前筛选命中 '+rows.reduce((n,r)=>n+r.shown.length,0)+' 条近期在租观察。0 表示本库无匹配记录。';
  $('cards').replaceChildren();
  if(!rows.length) node('article','没有符合条件的已核验记录。清空筛选可重新查看候选小区。',$('cards'));
  for(const {c,shown,y,q,direct,route} of rows){
    const card=node('article',null,$('cards'));
    card.id='card-'+c.id;card.tabIndex=-1;
    node('h2',c.name,card);
    node('p',[c.area,c.address].filter(Boolean).join(' · '),card);
    node('p',fmt(c.year,' 年建成')+' · '+fmt(c.households,' 户'),card);
    for(const t of c.tags||[]) node('span',t,card).className='tag';
    if(c.note) node('p',c.note,card).className='muted';
    const refs=node('p',null,card);
    link(refs,'小区资料',c.source);
    if(c.location) {refs.append(' · ');link(refs,'坐标来源',c.location.source);}
    refs.append(' · ');
    link(refs,'高德搜索地址','https://uri.amap.com/search?city=上海&keyword='+encodeURIComponent([c.address,c.name.split('｜')[0]].filter(Boolean).join(' ')));
    node('p','品质 '+fmt(q.score,' / 100',1)+' · 证据覆盖 '+q.coverage+'%',card);
    for(const e of q.evidence){
      const p=node('p',M.labels[e.axis]+' '+e.rating+'/4 · '+e.checkedAt+' · '+e.source,card);
      link(p,' 查看证据',e.source);
    }
    node('p','在租 '+shown.length+' 条观察 · '+fmt(M.median(shown.map(r=>r.monthlyRent).filter(Number.isFinite)),' 元/月中位数'),card);
    for(const r of shown){
      const p=node('p',[fmt(r.monthlyRent,' 元/月'),fmt(r.areaM2,' ㎡',1),fmt(r.bedrooms,' 室'),r.checkedAt,r.source].join(' · '),card);
      link(p,' 查看房源来源',r.source);
    }
    node('p','毛挂牌租售比 '+fmt(y?.pct,'%',2)+(y?' · 租 '+y.rentN+' / 售 '+y.saleN+' 套':' · 对照组条件无效'),card);
    node('p','直线 '+fmt(direct,' km',2)+' · 路线 '+fmt(route?.km,' km',2)+' · '+fmt(route?.minutes,' 分钟',1),card);
    if(route) {
      const p=node('p','路线场景 '+route.scenario+' · '+route.checkedAt+' · '+route.source,card);
      link(p,' 查看路线证据',route.source);
    }
  }
  renderMap(rows,destination);
}
$('file').addEventListener('change',async e=>{
  if(!e.target.files.length) return;
  try{
    const file=e.target.files[0];
    if(file.size>5*1024*1024) throw Error('本地试点文件上限为 5 MiB');
    data=M.validate(JSON.parse(await file.text()));
    $('error').textContent='';
    refresh();
  }catch(error){$('error').textContent='载入失败 · '+error.message;}
  finally{e.target.value='';}
});
for(const id of ['rent','area','year','beds','destination','mode','scenario','sort','crs','yb','ya','yz']) $(id).addEventListener('input',render);
refresh();
</script>
</html>
